name: Clack-Studio CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Clack Studio
        uses: actions/checkout@v4
        with:
          path: clack-studio

      - name: Checkout Clack Basic Dependency
        uses: actions/checkout@v4
        with:
          repository: relay-computing/clack-basic
          path: clack-basic

      - name: Toolchain Info
        run: |
          echo "🚀 Running on Popel ARM64 Forgejo Runner"
          go version
          node -v
          npm -v

      - name: Install Frontend Dependencies & Build
        run: |
          cd clack-studio/frontend
          npm install
          npm run build

      - name: Compile Go Binary
        run: |
          cd clack-studio
          go build -v -o bin/clack-studio .
          ls -lh bin/clack-studio
